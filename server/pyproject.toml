[project]
name = "blog-server"
version = "0.1.0"
description = "API блога из файлов Markdown"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
    "radon>=6",
    "pytest-cov>=6",
    "ruff>=0.13",
    "bandit>=1.8",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Кэш вне смонтированной директории, чтобы не мусорить на хосте
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: неиспользуемые импорты и переменные, ошибки имён
    "I",       # порядок импортов
    "B",       # bugbear: типичные ошибки
    "UP",      # современный синтаксис для целевой версии Python
    "SIM",     # упрощения
    "C4",      # генераторы и comprehensions
    "PT",      # стиль pytest
    "RUF",     # правила ruff
]
ignore = [
    # «Похожие» символы: кириллица в строках и комментариях — норма для проекта
    "RUF001", "RUF002", "RUF003",
]

[tool.mypy]
python_version = "3.14"
# Строгий режим: у всех функций полные аннотации, без неявного Any
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
# Кэш вне смонтированной директории, чтобы не мусорить на хосте
cache_dir = "/tmp/mypy-cache"

[tool.bandit]
# Проверяется и код, и тесты; в тестах assert — штатный способ проверки pytest
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["blog"]
branch = true
# Данные покрытия вне смонтированной директории, чтобы не мусорить на хосте
data_file = "/tmp/.coverage"

[tool.coverage.report]
show_missing = true
# Минимальное покрытие строк и веток, %; ниже — `make coverage` завершается с ошибкой
fail_under = 90
